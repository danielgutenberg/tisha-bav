<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Day of Meaning — Tisha B'Av 5786 | Jewish Content Network | Consult Write Media</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ BANNER ============ -->
<header class="banner" id="cover">
  <div class="banner__frame">
    <img src="images/welcome-banner.jpg" alt="A Day of Meaning — Tisha B'Av 5786" class="banner__img">

    <nav class="banner__nav">
      <a href="#contact" class="btn btn--ghost">Contact Us</a>
      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="menuPanel" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </nav>
    <div class="menu-panel" id="menuPanel">
      <div class="menu-panel__col">
        <a href="#sort-featured" data-sort="featured">Featured</a>
        <a href="#sort-newest" data-sort="newest">Newest</a>
        <a href="#sort-az" data-sort="az">A-Z</a>
      </div>
      <div class="menu-panel__col">
        <a href="#sort" class="menu-panel__label">Sort</a>
        <a href="#contact">Contact</a>
        <a href="#about">About</a>
      </div>
    </div>

    <button class="banner__start" id="startViewing" aria-label="Start viewing"></button>
  </div>
</header>

<!-- ============ BROWSE ============ -->
<main class="browse" id="browse">

  <div class="carousel" id="carousel">
    <button class="carousel__arrow carousel__arrow--prev" id="carPrev" aria-label="Previous">&#8249;</button>
    <div class="carousel__track" id="carTrack">
      <!-- slides injected by JS -->
    </div>
    <button class="carousel__arrow carousel__arrow--next" id="carNext" aria-label="Next">&#8250;</button>
    <span class="carousel__watch-badge">Watch</span>
  </div>

  <section class="grid" id="cardGrid">
    <!-- cards injected by JS -->
  </section>

</main>

<!-- ============ CONTACT ============ -->
<section class="contact" id="contact">
  <div class="contact__header">
    <div class="contact__titles">
      <h2 class="display-title display-title--tiny">A Day of Meaning</h2>
      <p class="display-subtitle display-subtitle--tiny">Tisha B'Av 5786</p>
    </div>
    <a href="#cover" class="btn btn--dark">Home</a>
  </div>

  <div class="contact__body">
    <div class="contact__brands">
      <img src="images/logos-lockup.png" alt="Jewish Content Network / ConsultWrite Media" class="contact__logo">
    </div>

    <form class="contact__form" id="contactForm">
      <label class="field">
        <span class="field__label">Name</span>
        <input type="text" name="name" required>
      </label>
      <label class="field">
        <span class="field__label">Email</span>
        <input type="email" name="email" required>
      </label>
      <label class="field">
        <span class="field__label">Phone</span>
        <input type="tel" name="phone">
      </label>
      <label class="field">
        <span class="field__label">Inquiry Reason</span>
        <textarea name="reason" rows="5"></textarea>
      </label>
      <button type="submit" class="btn btn--dark btn--send">Send</button>
      <p class="contact__success" id="contactSuccess" hidden>Thanks — your message has been sent.</p>
    </form>
  </div>

  <div class="contact__banner">
    <img src="images/footer-banner.jpg" alt="Jewish Content Network — Bringing your message to the hearts and homes of our nation">
  </div>
</section>

<!-- ============ MORE INFO MODAL ============ -->
<div class="modal" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
  <div class="modal__dialog">
    <button class="modal__close" data-close aria-label="Close">&times;</button>
    <div class="modal__media"><img id="infoModalImg" src="" alt=""></div>
    <div class="modal__body">
      <h3 class="modal__title" id="infoModalTitle"></h3>
      <p class="modal__subtitle" id="infoModalSubtitle"></p>
      <p class="modal__desc" id="infoModalDesc"></p>
      <a class="btn btn-watch" id="infoModalWatch" href="#" target="_blank" rel="noopener">Watch</a>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
