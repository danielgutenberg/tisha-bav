<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ BANNER ============ -->
<header class="banner" id="cover">
  <div class="banner__layout">
  <div class="banner__frame">
    <img src="images/welcome-banner.jpg" alt="A Day of Meaning — Tisha B'Av 5786" class="banner__img">

    <nav class="banner__nav">
      <a href="#contact" class="btn btn--ghost">Contact Us</a>
    </nav>

    <button class="banner__start" id="startViewing" aria-label="Start viewing"></button>
  </div>

  <a class="banner__scoop" href="https://thelakewoodscoop.com" target="_blank" rel="noopener">
    <img src="images/lakewood-scoop.png" alt="The Lakewood Scoop — Find all Lakewood Tisha B'av Programs here">
  </a>
  </div>
</header>

<!-- ============ BROWSE ============ -->
<main class="browse" id="browse">

  <!-- Carousel temporarily disabled
  <div class="carousel" id="carousel">
    <button class="carousel__arrow carousel__arrow--prev" id="carPrev" aria-label="Previous">&#8249;</button>
    <div class="carousel__track" id="carTrack">
      slides injected by JS
    </div>
    <button class="carousel__arrow carousel__arrow--next" id="carNext" aria-label="Next">&#8250;</button>
    <span class="carousel__watch-badge">Watch</span>
  </div>
  end carousel -->


  <section class="grid" id="cardGrid">

</main>

<!-- ============ CONTACT ============ -->
<section class="contact" id="contact">
  <div class="contact__header">
    <div class="contact__titles">
      <h2 class="display-title display-title--tiny">A Day of Meaning</h2>
      <p class="display-subtitle display-subtitle--tiny">Tisha B'Av 5786</p>
    </div>
    <a href="#cover" class="btn btn--dark">Home</a>
  </div>

  <div class="contact__body">
    <div class="contact__brands">
      <img src="images/logos-lockup.png" alt="Jewish Content Network / ConsultWrite Media" class="contact__logo">
    </div>

    <div class="contact__embed">
      <iframe
        class="contact__embed-frame"
        src="https://jewishcontentnetwork.com/#form"
        title="Contact Jewish Content Network"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <a class="contact__banner" href="https://jewishcontentnetwork.com" target="_blank" rel="noopener">
    <img src="images/footer-banner-jcn.jpg" alt="Jewish Content Network — Bringing your message to the hearts and homes of our nation">
  </a>
</section>

<!-- ============ MORE INFO MODAL ============ -->
<div class="modal" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
  <div class="modal__dialog">
    <button class="modal__close" data-close aria-label="Close">&times;</button>
    <div class="modal__media"><img id="infoModalImg" src="" alt=""></div>
    <div class="modal__body">
      <h3 class="modal__title" id="infoModalTitle"></h3>
      <p class="modal__subtitle" id="infoModalSubtitle"></p>
      <p class="modal__desc" id="infoModalDesc"></p>
      <a class="btn btn-watch" id="infoModalWatch" href="#" target="_blank" rel="noopener">Watch</a>

  </div>
</div>

<script src="js/script.js"></script>
